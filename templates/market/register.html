{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
     <div class="col-md-6 col-lg-5">
          <div class="text-center mb-4 page-enter">
               <img src="{% static 'logo.png' %}" alt="Campus Marketplace" width="70"
                    class="mb-3 bg-white p-2 rounded-4 shadow-sm">
               <h3 class="fw-bold">Join the Community</h3>
          </div>

          <div class="card card-custom p-4 page-enter" style="animation-delay: 0.1s;">
               <div class="d-flex bg-light rounded-pill p-1 mb-4">
                    <a href="{% url 'market:login' %}"
                         class="btn btn-light rounded-pill w-50 text-muted border-0">Login</a>
                    <a href="{% url 'market:register' %}"
                         class="btn btn-gradient rounded-pill w-50 shadow-sm">Register</a>
               </div>

               <form method="POST" action="{% url 'market:register' %}">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                         <label class="form-label small fw-bold text-muted">{{ field.label }}</label>
                         {{ field }}
                         {% if field.errors %}
                         <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                         {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-gradient w-100 fw-bold py-2 shadow-sm mt-3">Register</button>
               </form>
          </div>
     </div>
</div>

<script>
     document.querySelectorAll('input').forEach(el => el.classList.add('form-control', 'form-control-custom'));
</script>
{% endblock %}
