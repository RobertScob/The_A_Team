{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mb-5">
     <div class="col-lg-8">
          <div class="mb-4 text-center page-enter">
               <h2 class="fw-bold">Create New Listing</h2>
               <p class="text-muted">Share items you want to sell with the campus community</p>
          </div>

          <div class="card card-custom p-4 p-md-5 page-enter" style="animation-delay: 0.1s;">
               <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-4">
                         <label class="form-label fw-bold">Item Title</label>
                         <input type="text" name="title" class="form-control form-control-custom form-control-lg"
                              placeholder="e.g., Desk Lamp, Winter Jacket" required>
                    </div>

                    <div class="mb-4">
                         <label class="form-label fw-bold">Description</label>
                         <textarea name="description" class="form-control form-control-custom" rows="5"
                              placeholder="Describe your item in detail..."></textarea>
                    </div>

                    <div class="row mb-4">
                         <div class="col-md-6 mb-3 mb-md-0">
                              <label class="form-label fw-bold">Category</label>
                              <select name="category" class="form-select form-control-custom" required>
                                   <option value="FURNITURE">Furniture</option>
                                   <option value="ELECTRONICS">Electronics</option>
                                   <option value="CLOTHING">Clothing</option>
                                   <option value="STATIONERY">Stationery</option>
                                   <option value="BOOKS">Books</option>
                                   <option value="SPORTS">Sports</option>
                                   <option value="OTHER">Other</option>
                              </select>
                         </div>
                         <div class="col-md-6">
                              <label class="form-label fw-bold">Price (£)</label>
                              <div class="input-group">
                                   <span class="input-group-text bg-white border-end-0 text-muted">£</span>
                                   <input type="number" step="0.01" min="0" name="price"
                                        class="form-control form-control-custom border-start-0 ps-0" placeholder="0.00"
                                        required>
                              </div>
                         </div>
                    </div>

                    <div class="mb-5">
                         <label class="form-label fw-bold">Item Images</label>
                         <div class="border border-2 border-dashed rounded-4 p-5 text-center bg-light text-muted"
                              style="border-color: #e0e0e0 !important; cursor: pointer;"
                              onclick="document.getElementById('imageUpload').click()">
                              <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3 text-secondary opacity-50"></i>
                              <h5>Click to upload images</h5>
                              <p class="small mb-0">PNG, JPG up to 5MB</p>
                              <input type="file" id="imageUpload" name="images" multiple class="d-none"
                                   accept="image/*">
                         </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3">
                         <a href="{% url 'market:shop' %}" class="btn btn-light px-4">Cancel</a>
                         <button type="submit" class="btn btn-gradient px-5 shadow-sm">Publish Listing</button>
                    </div>
               </form>
          </div>
     </div>
</div>
{% endblock %}
