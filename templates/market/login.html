{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
     <div class="col-md-5 col-lg-4">
          <div class="text-center mb-4 page-enter">
               <img src="{% static 'logo.png' %}" alt="Campus Marketplace" width="70"
                    class="mb-3 bg-white p-2 rounded-4 shadow-sm">
               <h3 class="fw-bold">Campus Marketplace</h3>
               <p class="text-muted small">Buy and sell within your university community</p>
          </div>

          <div class="card card-custom p-4 page-enter" style="animation-delay: 0.1s;">
               <div class="d-flex bg-light rounded-pill p-1 mb-4">
                    <a href="{% url 'market:login' %}" class="btn btn-gradient rounded-pill w-50 shadow-sm">Login</a>
                    <a href="{% url 'market:register' %}"
                         class="btn btn-light rounded-pill w-50 text-muted border-0">Register</a>
               </div>

               <form method="POST" action="{% url 'market:login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                         <label class="form-label small fw-bold text-muted">Email</label>
                         <input type="email" name="email" class="form-control form-control-custom"
                              placeholder="Enter your email" required>
                    </div>
                    <div class="mb-4">
                         <label class="form-label small fw-bold text-muted">Password</label>
                         <input type="password" name="password" class="form-control form-control-custom"
                              placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100 fw-bold py-2 shadow-sm">Login</button>
               </form>
          </div>
     </div>
</div>
{% endblock %}
