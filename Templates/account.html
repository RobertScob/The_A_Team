<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/css.css">
</head>

<body>

<header class="header">
    <div class="header-left">
        <a href="purchase.html"><img src="logo.png" class="icon"></a>
        <h3>Campus Marketplace</h3>
    </div>

    <div class="header-centre"></div>

    <div class="header-right">
        <div class="balance">
            Balance: <!---->
        </div>

        <div class="header-icons">
            <a href="purchase.html"><img src="home.png" class="header-icon"></a>
            <a href="listing.html"><img src="plus.png" class="header-icon"></a>
            <a href="account.html"><img src="user.png" class="header-icon"></a>
            <a href="login.html"><img src="arrow.png" class="header-icon"></a>
        </div>
    </div>
</header>

<div class="dashboard-wrapper">

    <div class="top-row">
        <h1>Dashboard</h1>
        <p>Manage your account and listings</p>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <h4>My Listings</h4>
            <p class="stat-number">0</p>
        </div>

        <div class="stat-card">
            <h4>Purchases</h4>
            <p class="stat-number">3</p>
        </div>

        <div class="stat-card">
            <h4>Sales</h4>
            <p class="stat-number">10</p>
        </div>
    </div>

    <div class="profile-card">
        <h3>Profile Information</h3>
        <p><strong>Username: </strong>lucas07</p>
        <p><strong>Email: </strong>lucas@outlook.com</p>
    </div>

    <div class="listings-card">
        <h3>My Current Listings</h3>
        <p>No active listings</p>
    </div>

    <div class="purchases-card">
        <h3>Recent Purchases</h3>

        <div class="purchase-item">
            <span>Phone</span>
            <span class="price">£890</span>
        </div>

        <div class="purchase-item">
            <span>Bag</span>
            <span class="price">£25</span>
        </div>
    </div>

</div>

</body>
</html>
