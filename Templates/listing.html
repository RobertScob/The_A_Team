<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Listing</title>
  <link rel="stylesheet" href="listing.css">
</head>
 
<body>
 
<header class="header">
    <div class="header-left">
        <a href="purchase.html"><img src="logo.png" class="icon"></a>
        <h3>Campus Marketplace</h3>
    </div>

    <div class="header-centre"></div>

    <div class="header-right">
        <div class="balance">
            Balance: <!-- price -->
        </div>

        <div class="header-icons">
            <a href="purchase.html"><img src="home.png" class="header-icon"></a>
            <a href="listing.html"><img src="plus.png" class="header-icon"></a>
            <a href="account.html"><img src="user.png" class="header-icon"></a>
            <a href="login.html"><img src="arrow.png" class="header-icon"></a>
        </div>
    </div>
</header>
 
<div class="create-listing-container">
 
    <h1>Create New Listing</h1>
    <p class="subtitle">Share items you want to sell with the campus community</p>
 
    <div class="listing-card">
        <form>
 
            <label>Item Title</label>
            <input type="text" placeholder="e.g., Desk Lamp, Winter Jacket, Calculator">
 
            <label>Description</label>
            <textarea placeholder="Describe your item in detail..."></textarea>
 
            <label>Category</label>
            <select>
                <option>Furniture</option>
                <option>Electronics</option>
                <option>Clothing</option>
                <option>Stationery</option>
                <option>Books</option>
                <option>Sports</option>
                <option>Other</option>
            </select>
 
            <label>Price (£)</label>
            <input type="number" step="0.01" placeholder="0.00">
 
            <label>Item Image</label>
            <input type="file" accept="image/*">
 
            <button class="secbtn submit-btn">Create Listing</button>
 
        </form>
    </div>
 
</div>
 
</body>
</html>
